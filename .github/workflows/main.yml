name: Run Exercise Tracker

on:
  # Allows you to manually trigger the run from the GitHub Actions tab
  workflow_dispatch:
  # Optional: Runs automatically every day at 11 PM UTC
  schedule:
    - cron: '0 23 * * *'

jobs:
  run-tracker-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute Tracker Script with Secrets
      # Inject your secure environment variables directly into the runner
      env:
        SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
        BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        X_APP_ID: ${{ secrets.X_APP_ID }}
        X_APP_KEY: ${{ secrets.X_APP_KEY }}
        ENV_SHEETY_USERNAME: ${{ secrets.ENV_SHEETY_USERNAME }}
      run: python 100days_of_python/Day+38+Exercise_Tracker+\(solution\)/main.py

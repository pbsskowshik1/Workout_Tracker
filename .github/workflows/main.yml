name: Run Exercise Tracker

on:
  # Creates an interactive text input form on the GitHub website
  workflow_dispatch:
    inputs:
      workout_query:
        description: 'What exercise did you do today?'
        required: true
        default: 'ran 5k and cycled for 20 minutes'
        type: string

jobs:
  run-tracker-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Tracker Script with Secrets
      env:
        # Maps your exact GitHub repository secret names to your code keys
        SHEET_ENDPOINT: ${{ secrets.ENV_SHEETY_ENDPOINT }}
        BEARER_TOKEN: ${{ secrets.ENV_BEARER_TOKEN }}
        X_APP_ID: ${{ secrets.ENV_NIX_APP_ID }}
        X_APP_KEY: ${{ secrets.ENV_NIX_API_KEY }}
        # Passes what you type in the browser text box straight into Python
        DEFAULT_QUERY: ${{ inputs.workout_query }}
      run: python main.py

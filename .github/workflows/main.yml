name: Run Exercise Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

jobs:
  run-tracker-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Tracker Script with Secrets
      env:
        SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
        BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        X_APP_ID: ${{ secrets.X_APP_ID }}
        X_APP_KEY: ${{ secrets.X_APP_KEY }}
        ENV_SHEETY_USERNAME: ${{ secrets.ENV_SHEETY_USERNAME }}
      run: python main.py
